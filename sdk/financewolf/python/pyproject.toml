[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ironfang-financewolf"
version = "0.2.0"
description = "Ironfang Finance API validation client and CLI: Peppol UBL, XRechnung and ZUGFeRD / Factur-X, as XML or PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Ironfang Ltd"}]
dependencies = []

[project.scripts]
financewolf = "ironfang_financewolf.cli:main"

[project.urls]
Homepage = "https://ironfang.uk/finance"
Documentation = "https://ironfang.uk/docs/finance"

[tool.setuptools.packages.find]
where = ["src"]
